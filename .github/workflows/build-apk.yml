name: Build Android APK (Presensi SMANSA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js *.png *.ico *.jpg www/ 2>/dev/null || true

      - name: Install NPM Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: Configure Android Permissions & Settings
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            grep -q "android.permission.CAMERA" "$MANIFEST" || sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
            grep -q "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST" || sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
            grep -q "android.permission.ACCESS_COARSE_LOCATION" "$MANIFEST" || sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
            grep -q "android.permission.ACCESS_NETWORK_STATE" "$MANIFEST" || sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
            grep -q "android.hardware.camera" "$MANIFEST" || sed -i '/<application/i \    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"
            grep -q "android.hardware.location.gps" "$MANIFEST" || sed -i '/<application/i \    <uses-feature android:name="android.hardware.location.gps" android:required="false" />' "$MANIFEST"
          fi

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Presensi-SMANSA.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Presensi-SMANSA-APK
          path: release-apk/Presensi-SMANSA.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Presensi SMANSA Lhoksukon APK v1.0.0
          body: |
            ### 📱 Download File APK Android - Presensi SMANSA Lhoksukon
            
            Aplikasi resmi Presensi Digital SMA Negeri 1 Lhoksukon untuk Android.
            
            - **Nama Aplikasi**: Presensi SMANSA
            - **Domain**: https://absensi.smansalhoksukon.sch.id
            - **Fitur**: Kamera QR Scanner & Validasi GPS Anti-Fraud.
            
            Silakan unduh file `Presensi-SMANSA.apk` di bawah ini, lalu pasang di perangkat Android Anda.
          files: |
            release-apk/Presensi-SMANSA.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
