name: Build Android APK (Tanpa Iklan)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Android APK Release & Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd android-native
          chmod +x gradlew || true
          gradle assembleDebug --stacktrace || (gradle wrapper && ./gradlew assembleDebug)

      - name: Upload APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Presensi-SMANSA-Lhoksukon-APK
          path: android-native/app/build/outputs/apk/debug/*.apk
          retention-days: 30
